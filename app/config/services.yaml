imports:
    - { resource: '../src/Modules/Catalog/Resources/config/services.yaml' }
    - { resource: '../src/Modules/Order/Resources/config/services.yaml' }
    - { resource: '../src/Modules/Saga/Resources/config/services.yaml' }
    - { resource: '../src/Modules/Supply/Resources/config/services.yaml' }
    - { resource: '../src/Modules/Warehouse/Resources/config/services.yaml' }
    - { resource: '../src/Modules/Wallet/Resources/config/services.yaml' }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Shared/Domain/'
            - '../src/Shared/Infrastructure/Migrations/'
            - '../src/Shared/Infrastructure/Persistence/Entity/'
            - '../src/Modules/'

    App\Shared\Application\TransactionManager: '@App\Shared\Infrastructure\Persistence\OrmTransactionManager'
    App\Shared\Application\IdentityGenerator: '@App\Shared\Infrastructure\Persistence\PostgresIdentityGenerator'
    App\Shared\Application\EventPublisher: '@App\Shared\Infrastructure\Messaging\DbalOutboxEventPublisher'
    App\Shared\Application\EventSender: '@App\Shared\Infrastructure\Kafka\KafkaEventSender'
    App\Shared\Infrastructure\Kafka\KafkaClientFactory:
        arguments:
            $bootstrapServers: '%env(KAFKA_BOOTSTRAP_SERVERS)%'
            $consumerGroup: '%env(KAFKA_CONSUMER_GROUP)%'

    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%env(REDIS_URL)%', { lazy: true }]

    App\Shared\Infrastructure\Kafka\KafkaEventSender:
        arguments:
            $topic: '%env(KAFKA_TOPIC)%'

    App\Shared\Infrastructure\Console\PrepareTestDatabaseCommand:
        arguments:
            $migrations: '@doctrine.migrations.dependency_factory'
            $testDatabaseUrl: '%env(resolve:WALLET_TEST_DATABASE_URL)%'
            $applicationDatabaseUrl: '%env(resolve:DATABASE_URL)%'

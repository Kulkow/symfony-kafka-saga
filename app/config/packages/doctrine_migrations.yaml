doctrine_migrations:
    migrations_paths:
        App\Modules\Catalog\Infrastructure\Migrations: '%kernel.project_dir%/src/Modules/Catalog/Infrastructure/Migrations'
        App\Modules\Order\Infrastructure\Migrations: '%kernel.project_dir%/src/Modules/Order/Infrastructure/Migrations'
        App\Modules\Supply\Infrastructure\Migrations: '%kernel.project_dir%/src/Modules/Supply/Infrastructure/Migrations'
        App\Modules\Warehouse\Infrastructure\Migrations: '%kernel.project_dir%/src/Modules/Warehouse/Infrastructure/Migrations'
        App\Modules\Saga\Infrastructure\Migrations: '%kernel.project_dir%/src/Modules/Saga/Infrastructure/Migrations'
        App\Shared\Infrastructure\Migrations: '%kernel.project_dir%/src/Shared/Infrastructure/Migrations'
        DoctrineMigrations: '%kernel.project_dir%/src/Shared/Infrastructure/Migrations/Legacy'
    services:
        Doctrine\Migrations\Version\Comparator: App\Shared\Infrastructure\Persistence\MigrationComparator
    storage:
        table_storage:
            table_name: public.doctrine_migration_versions
    enable_profiler: false
    all_or_nothing: true
